[package]
name = "keyoverlay-overlay"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }

[dependencies]
anyhow = "1"
eframe = "0.27"
image = { version = "0.25", default-features = false, features = ["png"] }
keyoverlay-core = { path = "../core" }
keyoverlay-input = { path = "../input" }

[lib]
path = "src/lib.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }
