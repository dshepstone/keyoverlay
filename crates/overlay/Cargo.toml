[package]
name = "keyoverlay-overlay"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }

[dependencies]
anyhow = "1"
eframe = "0.27"
keyoverlay-core = { path = "../core" }
keyoverlay-input = { path = "../input" }

[lib]
path = "src/lib.rs"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }
