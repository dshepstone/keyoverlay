[package]
name = "keyoverlay-app"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
build = "build.rs"

[dependencies]
anyhow = "1"
eframe = "0.27"
image = { version = "0.24.9", default-features = false, features = ["png"] }
keyoverlay-core = { path = "../core" }
keyoverlay-input = { path = "../input" }
keyoverlay-overlay = { path = "../overlay" }

[target.'cfg(target_os = "windows")'.build-dependencies]
image = { version = "0.24.9", default-features = false, features = ["png"] }
winres = "0.1"

[[bin]]
name = "keyoverlay-app"
path = "src/main.rs"
