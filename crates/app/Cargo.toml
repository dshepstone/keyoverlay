[package]
name = "keyoverlay-app"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
build = "build.rs"

[dependencies]
anyhow = "1"
eframe = "0.27"
image = { version = "0.25", default-features = false, features = ["png"] }
keyoverlay-core = { path = "../core" }
keyoverlay-input = { path = "../input" }
keyoverlay-overlay = { path = "../overlay" }

[target.'cfg(windows)'.build-dependencies]
# build.rs only decodes/encodes PNG icons; skip the other image codecs.
image = { version = "0.25", default-features = false, features = ["png"] }
winres = "0.1"

[[bin]]
name = "keyoverlay-app"
path = "src/main.rs"
